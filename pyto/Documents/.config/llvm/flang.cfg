-target wasm32-pyto-wasip1
-D__PYTO__

--sysroot=<CFGDIR>/../../.local/lib/sysroot32-ehpic
-resource-dir <CFGDIR>/../../.local/share/clang32-ehpic

-I<CFGDIR>/../../.local/share/clang/finclude/flang/wasm32-pyto-wasip1
-I<CFGDIR>/../../.local/finclude
-L<CFGDIR>/../../.local/lib

-fPIC
-fPIE

-Wl,-Bdynamic
-Wl,--export-all
-Wl,--export-dynamic
-Wl,--growable-table

-L<CFGDIR>/../../.local/share/clang/lib/wasm32-pyto-wasip1
-lflang_rt.runtime

-Wl,--import-memory
-Wl,--shared-memory
-Wl,--initial-memory=16777216
-Wl,--max-memory=4294967296

-Wl,--experimental-pic
-Wl,--extra-features=mutable_globals

