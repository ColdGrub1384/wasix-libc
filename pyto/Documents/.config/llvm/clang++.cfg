-Xclang -no-disable-free

-target wasm32-pyto-wasip1
-D__PYTO__

--sysroot=<CFGDIR>/../../.local/lib/sysroot32-ehpic
-resource-dir <CFGDIR>/../../.local/share/clang32-ehpic

-I<CFGDIR>/../../.local/include
-L<CFGDIR>/../../.local/lib

-matomics
-mbulk-memory
-msimd128
-mrelaxed-simd
-mextended-const

-D_WASI_EMULATED_MMAN
-lwasi-emulated-mman

-D_WASI_EMULATED_PROCESS_CLOCKS
-lwasi-emulated-process-clocks

-fPIC
-fPIE

-Wl,-Bdynamic
-Wl,--export-all
-Wl,--export-dynamic
-Wl,--growable-table

-Wl,--import-memory
-Wl,--shared-memory
-Wl,--initial-memory=16777216
-Wl,--max-memory=4294967296

-Wl,--experimental-pic
-Wl,--extra-features=mutable_globals

-pthread
-lunwind

-fvisibility=default

-fwasm-exceptions
-mllvm
-wasm-use-legacy-eh=false
-mllvm
-wasm-enable-sjlj

